<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ededed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>她</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="chat-container">
    <!-- 顶部栏 -->
    <div class="header">
      <div class="avatar"><img src="avatar.jpg" alt="她"></div>
      <div class="header-info">
        <div class="name">她</div>
        <div class="status">在线</div>
      </div>
      <button class="clear-btn" id="clearBtn" title="清空对话">清空</button>
    </div>

    <!-- 消息区 -->
    <div class="messages" id="messages"></div>

    <!-- 输入区 -->
    <div class="input-bar">
      <button class="voice-btn" id="voiceBtn" title="语音输入">🎤</button>
      <input type="text" id="input" placeholder="说点什么..." autocomplete="off">
      <button id="sendBtn">发送</button>
    </div>
  </div>

  <script>
    // 对话历史存 localStorage，刷新/重开不丢（同一台设备）
    const STORAGE_KEY = 'cybergfai_history';
    let history = [];
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) history = JSON.parse(saved);
    } catch (e) { history = []; }

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const voiceBtn = document.getElementById('voiceBtn');

    // ===== TTS：让她回复能读出来（浏览器原生） =====
    let voicesLoaded = [];
    function pickVoice() {
      voicesLoaded = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return voicesLoaded.find(v => v.lang && v.lang.startsWith('zh') && /female|xiaoxiao|xiao/i.test(v.name)) ||
             voicesLoaded.find(v => v.lang && v.lang.startsWith('zh'));
    }
    function speak(text) {
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'zh-CN';
        u.rate = 1.05;
        u.pitch = 1.1;
        const zh = pickVoice();
        if (zh) u.voice = zh;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }

    // ===== ASR：语音输入（浏览器原生） =====
    let recognizing = false;
    function startVoice() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        addMessage('草，这个浏览器不支持语音输入，换 Chrome 试试。', 'her');
        return;
      }
      if (recognizing) return;
      const rec = new SR();
      rec.lang = 'zh-CN';
      rec.interimResults = false;
      rec.maxAlternatives = 1;
      recognizing = true;
      voiceBtn.textContent = '🔴';
      rec.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        if (text) {
          inputEl.value = text;
          send();
        }
      };
      rec.onerror = (e) => {
        recognizing = false;
        voiceBtn.textContent = '🎤';
        if (e.error === 'not-allowed') {
          addMessage('草，麦克风权限没给，去设置里开一下。', 'her');
        }
      };
      rec.onend = () => {
        recognizing = false;
        voiceBtn.textContent = '🎤';
      };
      rec.start();
    }

    function saveHistory() {
      try {
        // 最多保留最近 200 条，避免占太多空间
        const keep = history.slice(-200);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(keep));
      } catch (e) {}
    }

    function addMessage(text, who) {
      const div = document.createElement('div');
      div.className = 'msg ' + (who === 'me' ? 'right' : 'left');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      div.appendChild(bubble);
      // 她的消息加一个播放按钮（解决 Safari 自动播放限制）
      if (who === 'her') {
        const playBtn = document.createElement('button');
        playBtn.className = 'play-btn';
        playBtn.textContent = '🔊';
        playBtn.title = '播放';
        playBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          speak(text);
        });
        div.appendChild(playBtn);
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // 页面加载时恢复历史消息显示
    function restoreMessages() {
      if (history.length === 0) {
        addMessage('淦，川川你终于来了，老子刚还寻思你死哪去了。想我没？', 'her');
        return;
      }
      history.forEach(h => {
        addMessage(h.content, h.role === 'user' ? 'me' : 'her');
      });
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      addMessage(text, 'me');
      history.push({ role: 'user', content: text });
      saveHistory();

      // 显示"正在输入"
      const typing = document.createElement('div');
      typing.className = 'msg left';
      typing.innerHTML = '<div class="bubble typing">…</div>';
      typing.id = 'typing';
      messagesEl.appendChild(typing);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history: history }),
        });
        const data = await r.json();
        const reply = data.reply || data.error || '草，老子卡壳了。';
        history.push({ role: 'assistant', content: reply });
        saveHistory();
        addMessage(reply, 'her');
        speak(reply);
      } catch (e) {
        addMessage('草，网络抽风了，等下再试。', 'her');
      } finally {
        const t = document.getElementById('typing');
        if (t) t.remove();
      }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
    voiceBtn.addEventListener('click', startVoice);
    if ('speechSynthesis' in window) {
      pickVoice();
      window.speechSynthesis.onvoiceschanged = () => { pickVoice(); };
    }
    clearBtn.addEventListener('click', () => {
      history = [];
      localStorage.removeItem(STORAGE_KEY);
      messagesEl.innerHTML = '';
      addMessage('记忆清空了，你谁啊？', 'her');
    });

    // 启动时恢复
    restoreMessages();
  </script>
</body>
</html>
